<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Victoria ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff7f9;
    color:#442c35;
    overflow-x:hidden;
}

/* =========================
   PORTADA
========================= */

#portada{
    min-height:100vh;
    background:
        linear-gradient(rgba(25,5,15,.25),rgba(25,5,15,.75)),
        url("foto1.jpg") center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    color:white;
}

.portadaContenido{
    max-width:600px;
    animation:entrada 1.5s ease;
}

.corazonGrande{
    font-size:65px;
    animation:latido 1.2s infinite;
}

#portada h1{
    font-size:50px;
    margin:15px 0;
    text-shadow:0 3px 15px rgba(0,0,0,.45);
}

#portada p{
    font-size:19px;
    line-height:1.6;
    margin-bottom:30px;
}

.boton{
    border:none;
    background:#e84b72;
    color:white;
    padding:16px 28px;
    border-radius:40px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(232,75,114,.35);
}

/* =========================
   CONTENIDO
========================= */

#historia{
    display:none;
}

.seccion{
    max-width:950px;
    margin:auto;
    padding:65px 20px;
    text-align:center;
}

.titulo{
    font-size:34px;
    color:#d63f67;
    margin-bottom:12px;
}

.subtitulo{
    color:#81646e;
    margin-bottom:35px;
    line-height:1.6;
}

/* =========================
   HISTORIA
========================= */

.lineaTiempo{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.tarjeta{
    background:white;
    border-radius:24px;
    padding:30px 22px;
    box-shadow:0 10px 35px rgba(90,30,55,.10);
}

.fecha{
    color:#e84b72;
    font-size:24px;
    font-weight:bold;
    margin-bottom:12px;
}

.tarjeta p{
    line-height:1.7;
}

/* =========================
   CONTADORES
========================= */

.contadores{
    background:linear-gradient(135deg,#e84b72,#b93660);
    color:white;
    padding:55px 20px;
}

.contadorGrid{
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.contadorCaja{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.25);
    border-radius:22px;
    padding:25px;
}

.contadorCaja h3{
    margin-bottom:12px;
}

.numeroTiempo{
    font-size:20px;
    font-weight:bold;
}

/* =========================
   GALERÍA
========================= */

.galeria{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.galeria img{
    width:100%;
    height:330px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    transition:.3s;
}

.galeria img:hover{
    transform:scale(1.02);
}

.galeria img:first-child{
    grid-column:1 / -1;
    height:420px;
}

/* =========================
   CARTA
========================= */

.carta{
    background:white;
    max-width:720px;
    margin:auto;
    padding:38px 28px;
    border-radius:25px;
    box-shadow:0 12px 40px rgba(100,30,60,.12);
    text-align:left;
    line-height:1.9;
    font-size:17px;
}

.carta h2{
    color:#d63f67;
    text-align:center;
    margin-bottom:25px;
}

.firma{
    text-align:right;
    font-weight:bold;
    color:#d63f67;
    margin-top:25px;
}

/* =========================
   SORPRESA
========================= */

.sorpresa{
    background:#fde8ee;
}

#mensajeSecreto{
    display:none;
    margin-top:25px;
    font-size:29px;
    color:#d63f67;
    font-weight:bold;
    animation:entrada .8s ease;
}

#mensajeSecreto.abierto{
    display:block;
}

/* =========================
   FINAL
========================= */

.final{
    min-height:70vh;
    background:
        linear-gradient(rgba(30,5,15,.40),rgba(30,5,15,.80)),
        url("foto5.jpg") center/cover;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
}

.final h2{
    font-size:43px;
    margin-bottom:20px;
}

.final p{
    max-width:650px;
    font-size:19px;
    line-height:1.8;
}

.infinito{
    font-size:45px;
    margin-top:20px;
}

/* =========================
   MÚSICA
========================= */

.controlMusica{
    position:fixed;
    right:18px;
    bottom:18px;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:#e84b72;
    color:white;
    font-size:23px;
    z-index:999;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    display:none;
}

/* =========================
   CORAZONES
========================= */

.heart{
    position:fixed;
    bottom:-50px;
    z-index:998;
    pointer-events:none;
    animation:subir 7s linear forwards;
}

/* =========================
   ANIMACIONES
========================= */

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes latido{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.18);}
}

        opacity:0;
